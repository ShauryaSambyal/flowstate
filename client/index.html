<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons built from the FS brand mark by scripts/generate-favicons.py.
         The -dark pair keeps the mark visible on dark browser chrome; drop
         those two links for a black-only set. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLOWSTATE | Shape Habits and Predict Outcomes</title>
    <meta name="description" content="Experience a new way to manage your tasks with FLOWSTATE." />

    <!-- Prevent flash of wrong theme: apply persisted mode/theme before paint -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('flowstate.mode');
          if (mode !== 'light' && mode !== 'dark') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-mode', mode);
          // Mono is the single shipped theme — the switcher is gone, so this is
          // no longer read from storage.
          document.documentElement.setAttribute('data-theme', 'mono');
          document.documentElement.style.colorScheme = mode;
        } catch (e) {
          document.documentElement.setAttribute('data-mode', 'light');
          document.documentElement.setAttribute('data-theme', 'mono');
        }
      })();
    </script>

    <link rel="preload" href="/fonts/NType82-Headline.otf" as="font" type="font/otf" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@10..48,200..800&family=Bitcount+Single:wght@100..900&family=Fontdiner+Swanky&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
